services:
  nexus:
    build: .
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "3060:3060"
    environment:
      - NEXUS_PORT=3060
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - NEXUS_DATA_DIR=/app/data
    volumes:
      - nexus-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3060/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nexus-data:
